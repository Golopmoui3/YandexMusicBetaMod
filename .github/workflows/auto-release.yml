name: auto-release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-master
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the latest Yandex Music version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL \
            --retry 3 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            https://music-desktop-application.s3.yandex.net/stable/latest.yml \
            | grep -m1 '^version:' | awk '{print $2}' | tr -d '\r')

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version from latest.yml: $VERSION" >&2
            exit 1
          fi

          STORED=$(tr -d '\r\n' < LAST_BUILD_VERSION 2>/dev/null || echo "none")
          echo "latest: $VERSION | last built: $STORED"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$STORED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check sources
        run: bun run typecheck

      - name: Build installer
        env:
          VITE_MOD_VERSION: ${{ needs.check.outputs.version }}
        run: bun start

      - name: Collect installer
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $installers = @(Get-ChildItem -Path .versions -Recurse -File -Filter "Setup*.exe" |
            Where-Object { $_.FullName -notmatch 'node_modules' })
          if ($installers.Count -eq 0) { throw "Installer was not produced" }
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName -Destination $out -Force
          }
          Get-ChildItem $out

      - name: Checksums
        shell: pwsh
        run: |
          $checksumFile = "./artifacts/SHASUMS256.txt"
          Remove-Item $checksumFile -Force -ErrorAction SilentlyContinue
          $installers = @(Get-ChildItem ./artifacts/Setup*.exe -File)
          if ($installers.Count -eq 0) { throw "No installer to checksum" }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Out-File $checksumFile -Append -Encoding utf8
          }
          Get-Content $checksumFile

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ needs.check.outputs.version }}
          name: "Яндекс Музыка ${{ needs.check.outputs.version }} — авто-сборка мода"
          body: |
            Автоматическая сборка мода поверх последней стабильной версии Яндекс Музыки.

            - Версия приложения: **${{ needs.check.outputs.version }}**
            - Установщик: `Setup*.exe`
            - Целостность: `SHASUMS256.txt`
          files: |
            artifacts/Setup*.exe
            artifacts/SHASUMS256.txt

      - name: Record successful release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.version }}"
          printf '%s\n' "$VERSION" > LAST_BUILD_VERSION
          cat > .meta/meta.json <<EOF
          {
            "modStable": "$VERSION",
            "downloadUrl": "https://github.com/Golopmoui3/YandexMusicBetaMod/releases/latest"
          }
          EOF

          git config user.name "Golopmoui3"
          git config user.email "Golopmoui3@users.noreply.github.com"
          git add LAST_BUILD_VERSION .meta/meta.json
          git commit -m "chore: built for Yandex Music $VERSION [skip ci]" || exit 0
          git pull --rebase origin master
          git push origin HEAD:master
