name: auto-release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yandex-music-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      mod_version: ${{ steps.check.outputs.mod_version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the latest Yandex Music version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL \
            --retry 3 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            https://music-desktop-application.s3.yandex.net/stable/latest.yml \
            | grep -m1 '^version:' | awk '{print $2}' | tr -d '\r')

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version from latest.yml: $VERSION" >&2
            exit 1
          fi

          STORED=$(tr -d '\r\n' < LAST_BUILD_VERSION 2>/dev/null || echo "none")
          MOD_VERSION="$VERSION.$GITHUB_RUN_ID"
          echo "latest: $VERSION | last built: $STORED | mod: $MOD_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$STORED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check sources
        run: bun run typecheck

      - name: Build Setup and Portable executables
        env:
          VITE_MOD_VERSION: ${{ needs.check.outputs.mod_version }}
        run: bun start

      - name: Collect and validate release artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.check.outputs.version }}"
          $out = "$env:GITHUB_WORKSPACE/artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $setups = @(Get-ChildItem -Path .versions -Recurse -File -Filter "Setup.$version.exe" |
            Where-Object { $_.FullName -notmatch 'node_modules' })
          $portables = @(Get-ChildItem -Path .versions -Recurse -File -Filter "Portable.$version.exe" |
            Where-Object { $_.FullName -notmatch 'node_modules' })
          if ($setups.Count -ne 1) { throw "Expected one Setup executable, found $($setups.Count)" }
          if ($portables.Count -ne 1) { throw "Expected one Portable executable, found $($portables.Count)" }

          Copy-Item $setups[0].FullName -Destination $out -Force
          Copy-Item $portables[0].FullName -Destination $out -Force
          Get-ChildItem $out | Format-Table Name, Length

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $checksumFile = "./artifacts/SHASUMS256.txt"
          Remove-Item $checksumFile -Force -ErrorAction SilentlyContinue
          $executables = @(Get-ChildItem ./artifacts/*.exe -File | Sort-Object Name)
          if ($executables.Count -ne 2) { throw "Expected two executables to checksum, found $($executables.Count)" }
          foreach ($executable in $executables) {
            $hash = (Get-FileHash $executable.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($executable.Name)" | Out-File $checksumFile -Append -Encoding utf8
          }
          Get-Content $checksumFile

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ needs.check.outputs.mod_version }}
          target_commitish: master
          name: "Yandex Music Mod ${{ needs.check.outputs.mod_version }}"
          body: |
            Автоматическая сборка мода поверх последней стабильной версии Яндекс Музыки.

            - Версия мода: **${{ needs.check.outputs.mod_version }}**
            - Версия приложения: **${{ needs.check.outputs.version }}**
            - `Setup.${{ needs.check.outputs.version }}.exe` — установщик Windows
            - `Portable.${{ needs.check.outputs.version }}.exe` — переносимая версия без установки
            - `SHASUMS256.txt` — контрольные суммы SHA-256
          files: |
            artifacts/Setup.${{ needs.check.outputs.version }}.exe
            artifacts/Portable.${{ needs.check.outputs.version }}.exe
            artifacts/SHASUMS256.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove stale release assets and verify publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $appVersion = "${{ needs.check.outputs.version }}"
          $tag = "app-${{ needs.check.outputs.mod_version }}"
          $allowed = @("Setup.$appVersion.exe", "Portable.$appVersion.exe", "SHASUMS256.txt")
          $release = gh release view $tag --repo Golopmoui3/YandexMusicBetaMod --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to read release $tag" }

          foreach ($asset in $release.assets) {
            if ($allowed -notcontains $asset.name) {
              gh release delete-asset $tag $asset.name --repo Golopmoui3/YandexMusicBetaMod --yes
              if ($LASTEXITCODE -ne 0) { throw "Unable to remove stale asset $($asset.name)" }
            }
          }

          $published = (gh release view $tag --repo Golopmoui3/YandexMusicBetaMod --json assets | ConvertFrom-Json).assets.name
          foreach ($name in $allowed) {
            if ($published -notcontains $name) { throw "Release asset is missing: $name" }
          }
          if (@($published).Count -ne $allowed.Count) {
            throw "Unexpected release assets remain: $($published -join ', ')"
          }
          "Published assets: $($published -join ', ')"

      - name: Record successful release
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="${{ needs.check.outputs.version }}"
          MOD_VERSION="${{ needs.check.outputs.mod_version }}"
          printf '%s\n' "$APP_VERSION" > LAST_BUILD_VERSION
          cat > .meta/meta.json <<EOF
          {
            "modStable": "$MOD_VERSION",
            "downloadUrl": "https://github.com/Golopmoui3/YandexMusicBetaMod/releases/latest"
          }
          EOF

          git config user.name "Golopmoui3"
          git config user.email "Golopmoui3@users.noreply.github.com"
          git add LAST_BUILD_VERSION .meta/meta.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish mod $MOD_VERSION for Yandex Music $APP_VERSION [skip ci]"
          fi
          git pull --rebase origin master
          git push origin HEAD:master
