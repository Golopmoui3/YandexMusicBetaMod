name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Type-check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bun run typecheck 2>&1 | tee typecheck.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "## TypeScript check failed"
              echo
              echo '```text'
              sed -n '1,220p' typecheck.log
              echo '```'
            } > typecheck-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file typecheck-comment.md
          fi

          exit "$STATUS"

      - name: Build UI
        run: bun run ui:build

  windows-build:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Build and verify Setup and Portable executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          & bun start 2>&1 | Tee-Object -FilePath build.log
          $status = $LASTEXITCODE

          if ($status -eq 0) {
            $setups = @(Get-ChildItem -Path .versions -Recurse -File -Filter "Setup.*.exe" |
              Where-Object { $_.FullName -notmatch 'node_modules' })
            $portables = @(Get-ChildItem -Path .versions -Recurse -File -Filter "Portable.*.exe" |
              Where-Object { $_.FullName -notmatch 'node_modules' })

            if ($setups.Count -ne 1 -or $portables.Count -ne 1) {
              "Expected exactly one Setup and one Portable executable; found Setup=$($setups.Count), Portable=$($portables.Count)" |
                Tee-Object -FilePath build.log -Append
              $status = 1
            } else {
              "Verified release artifacts:" | Tee-Object -FilePath build.log -Append
              @($setups[0], $portables[0]) | ForEach-Object {
                "- $($_.Name) ($($_.Length) bytes)" | Tee-Object -FilePath build.log -Append
              }
            }
          }

          if ($status -ne 0 -and "${{ github.event_name }}" -eq "pull_request") {
            $body = @(
              "## Windows Setup/Portable build failed",
              "",
              '```text',
              (Get-Content build.log -Tail 220),
              '```'
            )
            $body | Set-Content -Path build-comment.md -Encoding utf8
            gh pr comment "${{ github.event.pull_request.number }}" --body-file build-comment.md
          }

          exit $status
