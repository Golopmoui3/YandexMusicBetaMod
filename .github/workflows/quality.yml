name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Type-check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bun run typecheck 2>&1 | tee typecheck.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "## TypeScript check failed"
              echo
              echo '```text'
              sed -n '1,220p' typecheck.log
              echo '```'
            } > typecheck-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file typecheck-comment.md
          fi

          exit "$STATUS"

      - name: Build UI
        run: bun run ui:build
