name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Полный пайплайн: скачать стабильную сборку Яндекс Музыки, пропатчить,
      # собрать мод и упаковать установщик через electron-builder.
      # winCodeSign-воркэраунд применяется сам (src/patcher/wincodesign-workaround.ts).
      - name: Build installer
        run: bun start

      - name: Collect artifacts
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Get-ChildItem -Path .versions -Recurse -Include *.exe,*.yml |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            Copy-Item -Destination $out
          Get-ChildItem $out

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem ./artifacts/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File ./artifacts/SHASUMS256.txt -Append
          }
          Get-Content ./artifacts/SHASUMS256.txt

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/SHASUMS256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
