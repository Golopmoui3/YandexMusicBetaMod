name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check sources
        run: bun run typecheck

      - name: Build installer
        run: bun start

      - name: Collect installer
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $installers = @(Get-ChildItem -Path .versions -Recurse -File -Filter "Setup*.exe" |
            Where-Object { $_.FullName -notmatch 'node_modules' })
          if ($installers.Count -eq 0) { throw "Installer was not produced" }
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName -Destination $out -Force
          }

      - name: Checksums
        shell: pwsh
        run: |
          $checksumFile = "./artifacts/SHASUMS256.txt"
          Remove-Item $checksumFile -Force -ErrorAction SilentlyContinue
          foreach ($installer in Get-ChildItem ./artifacts/Setup*.exe -File) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Out-File $checksumFile -Append -Encoding utf8
          }
          if (-not (Test-Path $checksumFile)) { throw "Checksums were not produced" }

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Setup*.exe
            artifacts/SHASUMS256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
