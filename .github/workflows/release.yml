name: release

on:
  push:
    branches: [master]
    paths-ignore:
      - "LAST_BUILD_VERSION"
      - ".meta/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yandex-music-release
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      mod_version: ${{ steps.version.outputs.mod_version }}
    steps:
      - name: Resolve release versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(curl -fsSL \
            --retry 3 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            https://music-desktop-application.s3.yandex.net/stable/latest.yml \
            | grep -m1 '^version:' | awk '{print $2}' | tr -d '\r')

          if [[ ! "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version from latest.yml: $APP_VERSION" >&2
            exit 1
          fi

          MOD_VERSION="$APP_VERSION.$GITHUB_RUN_ID"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Yandex Music: $APP_VERSION | mod: $MOD_VERSION"

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check sources
        run: bun run typecheck

      - name: Build Setup and Portable executables
        env:
          VITE_MOD_VERSION: ${{ needs.resolve-version.outputs.mod_version }}
        run: bun start

      - name: Collect and validate release artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-version.outputs.app_version }}"
          $out = "$env:GITHUB_WORKSPACE/artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $setups = @(Get-ChildItem -Path .versions -Recurse -File -Filter "Setup.$version.exe" |
            Where-Object { $_.FullName -notmatch 'node_modules' })
          $portables = @(Get-ChildItem -Path .versions -Recurse -File -Filter "Portable.$version.exe" |
            Where-Object { $_.FullName -notmatch 'node_modules' })
          if ($setups.Count -ne 1) { throw "Expected one Setup executable, found $($setups.Count)" }
          if ($portables.Count -ne 1) { throw "Expected one Portable executable, found $($portables.Count)" }

          Copy-Item $setups[0].FullName -Destination $out -Force
          Copy-Item $portables[0].FullName -Destination $out -Force
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/

  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check sources
        run: bun run typecheck

      - name: Build macOS DMG and ZIP
        env:
          VITE_MOD_VERSION: ${{ needs.resolve-version.outputs.mod_version }}
        run: bun start

      - name: Collect and validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$out"

          find .versions/*/mod/dist -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.zip" \) -exec cp -v {} "$out/" \;

          ls -lh "$out"
          dmg_count=$(find "$out" -maxdepth 1 -name "*.dmg" | wc -l)
          zip_count=$(find "$out" -maxdepth 1 -name "*.zip" | wc -l)
          if [ "$dmg_count" -lt 1 ] || [ "$zip_count" -lt 1 ]; then
            echo "Expected at least one DMG and one ZIP file, found DMG: $dmg_count, ZIP: $zip_count"
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/

  publish-release:
    needs: [resolve-version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          rm -f SHASUMS256.txt
          sha256sum * > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ needs.resolve-version.outputs.mod_version }}
          target_commitish: ${{ github.sha }}
          name: "Yandex Music Mod ${{ needs.resolve-version.outputs.mod_version }}"
          body: |
            Проверенная релизная сборка Yandex Music Mod поверх стабильной версии Яндекс Музыки.

            - Версия мода: **${{ needs.resolve-version.outputs.mod_version }}**
            - Версия приложения: **${{ needs.resolve-version.outputs.app_version }}**
            - **Windows**: `Setup.${{ needs.resolve-version.outputs.app_version }}.exe` (установщик), `Portable.${{ needs.resolve-version.outputs.app_version }}.exe` (портативная)
            - **macOS**: `Яндекс Музыка-${{ needs.resolve-version.outputs.app_version }}.dmg` (установочный образ), `YandexMusicMod-${{ needs.resolve-version.outputs.app_version }}-mac.zip`
            - `SHASUMS256.txt` — контрольные суммы SHA-256
          files: artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record successful release
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="${{ needs.resolve-version.outputs.app_version }}"
          MOD_VERSION="${{ needs.resolve-version.outputs.mod_version }}"
          printf '%s\n' "$APP_VERSION" > LAST_BUILD_VERSION
          cat > .meta/meta.json <<EOF
          {
            "modStable": "$MOD_VERSION",
            "downloadUrl": "https://github.com/Golopmoui3/YandexMusicBetaMod/releases/latest"
          }
          EOF

          git config user.name "Golopmoui3"
          git config user.email "Golopmoui3@users.noreply.github.com"
          git add LAST_BUILD_VERSION .meta/meta.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish mod $MOD_VERSION for Yandex Music $APP_VERSION [skip ci]"
          fi
          git pull --rebase origin master
          git push origin HEAD:master
