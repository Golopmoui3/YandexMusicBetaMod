name: release

on:
  push:
    branches: [master]
    paths-ignore:
      - "LAST_BUILD_VERSION"
      - ".meta/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yandex-music-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check sources
        run: bun run typecheck

      - name: Build Setup and Portable executables
        run: bun start

      - name: Collect and validate release artifacts
        id: artifacts
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $setups = @(Get-ChildItem -Path .versions -Recurse -File -Filter "Setup.*.exe" |
            Where-Object { $_.FullName -notmatch 'node_modules' })
          $portables = @(Get-ChildItem -Path .versions -Recurse -File -Filter "Portable.*.exe" |
            Where-Object { $_.FullName -notmatch 'node_modules' })
          if ($setups.Count -ne 1) { throw "Expected one Setup executable, found $($setups.Count)" }
          if ($portables.Count -ne 1) { throw "Expected one Portable executable, found $($portables.Count)" }

          $setupVersion = $setups[0].BaseName.Substring("Setup.".Length)
          $portableVersion = $portables[0].BaseName.Substring("Portable.".Length)
          if ($setupVersion -ne $portableVersion) {
            throw "Artifact version mismatch: Setup=$setupVersion, Portable=$portableVersion"
          }

          Copy-Item $setups[0].FullName -Destination $out -Force
          Copy-Item $portables[0].FullName -Destination $out -Force
          "version=$setupVersion" >> $env:GITHUB_OUTPUT
          Get-ChildItem $out | Format-Table Name, Length

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $checksumFile = "./artifacts/SHASUMS256.txt"
          Remove-Item $checksumFile -Force -ErrorAction SilentlyContinue
          $executables = @(Get-ChildItem ./artifacts/*.exe -File | Sort-Object Name)
          if ($executables.Count -ne 2) { throw "Expected two executables to checksum, found $($executables.Count)" }
          foreach ($executable in $executables) {
            $hash = (Get-FileHash $executable.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($executable.Name)" | Out-File $checksumFile -Append -Encoding utf8
          }
          Get-Content $checksumFile

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ steps.artifacts.outputs.version }}
          target_commitish: master
          name: "Яндекс Музыка ${{ steps.artifacts.outputs.version }} — Yandex Music Mod"
          body: |
            Проверенная релизная сборка Yandex Music Mod поверх стабильной версии Яндекс Музыки.

            - Версия приложения: **${{ steps.artifacts.outputs.version }}**
            - `Setup.${{ steps.artifacts.outputs.version }}.exe` — установщик Windows
            - `Portable.${{ steps.artifacts.outputs.version }}.exe` — переносимая версия без установки
            - `SHASUMS256.txt` — контрольные суммы SHA-256
          files: |
            artifacts/Setup.${{ steps.artifacts.outputs.version }}.exe
            artifacts/Portable.${{ steps.artifacts.outputs.version }}.exe
            artifacts/SHASUMS256.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove stale release assets and verify publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.artifacts.outputs.version }}"
          $tag = "app-$version"
          $allowed = @("Setup.$version.exe", "Portable.$version.exe", "SHASUMS256.txt")
          $release = gh release view $tag --repo Golopmoui3/YandexMusicBetaMod --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to read release $tag" }

          foreach ($asset in $release.assets) {
            if ($allowed -notcontains $asset.name) {
              gh release delete-asset $tag $asset.name --repo Golopmoui3/YandexMusicBetaMod --yes
              if ($LASTEXITCODE -ne 0) { throw "Unable to remove stale asset $($asset.name)" }
            }
          }

          $published = (gh release view $tag --repo Golopmoui3/YandexMusicBetaMod --json assets | ConvertFrom-Json).assets.name
          foreach ($name in $allowed) {
            if ($published -notcontains $name) { throw "Release asset is missing: $name" }
          }
          if (@($published).Count -ne $allowed.Count) {
            throw "Unexpected release assets remain: $($published -join ', ')"
          }
          "Published assets: $($published -join ', ')"
